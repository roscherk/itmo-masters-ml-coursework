<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="100%" height="100%" role="img"
     aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title id="title">Как устроен датасет LAION</title>
  <desc id="desc">Изображение и подпись кодируются моделью CLIP, пара проходит фильтр по косинусному сходству; запись LAION-10M содержит ссылку, описание, эмбеддинг на 768 измерений и CLIP-score</desc>

  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F2B84B" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6E675F" />
    </marker>
  </defs>

  <!-- Фон -->
  <rect width="980" height="300" rx="16" fill="#121212" />

  <!-- ============ Источник пары ============ -->
  <rect x="24" y="36" width="164" height="48" rx="10" fill="#22201E" stroke="#6E675F" stroke-width="1.6" />
  <text x="106" y="66" text-anchor="middle" fill="#fffefb" font-size="15" font-weight="500">изображение</text>

  <rect x="24" y="92" width="164" height="48" rx="10" fill="#22201E" stroke="#6E675F" stroke-width="1.6" />
  <text x="106" y="122" text-anchor="middle" fill="#fffefb" font-size="15" font-weight="500">текст описания</text>

  <!-- Стрелки в CLIP -->
  <path d="M 190 60 L 218 74" fill="none" stroke="#F2B84B" stroke-width="2" marker-end="url(#arrow-amber)" />
  <path d="M 190 116 L 218 102" fill="none" stroke="#F2B84B" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- ============ CLIP ============ -->
  <rect x="224" y="36" width="180" height="104" rx="12" fill="#241E13" stroke="#F2B84B" stroke-width="2" />
  <text x="314" y="80" text-anchor="middle" fill="#fffefb" font-size="15" font-weight="700">CLIP ViT-L/14</text>
  <text x="314" y="105" text-anchor="middle" fill="#F2B84B" font-size="12" font-weight="600" font-style="italic">e_img, e_text</text>

  <!-- ============ Фильтр ============ -->
  <path d="M 406 88 L 436 88" fill="none" stroke="#F2B84B" stroke-width="2" marker-end="url(#arrow-amber)" />

  <rect x="440" y="36" width="204" height="104" rx="12" fill="#241E13" stroke="#F2B84B" stroke-width="2" />
  <text x="542" y="80" text-anchor="middle" fill="#fffefb" font-size="14" font-weight="700">фильтр по CLIP-score</text>
  <text x="542" y="105" text-anchor="middle" fill="#fffefb" fill-opacity="0.7" font-size="12">cos(e_img, e_text) ≥ τ</text>

  <!-- ============ Результат: LAION-10M ============ -->
  <path d="M 646 88 L 672 88" fill="none" stroke="#F2B84B" stroke-width="2" marker-end="url(#arrow-amber)" />

  <rect x="676" y="36" width="280" height="104" rx="12" fill="#18261A" stroke="#6BC075" stroke-width="2" />
  <text x="816" y="80" text-anchor="middle" fill="#fffefb" font-size="16" font-weight="700">LAION-10M</text>
  <text x="816" y="105" text-anchor="middle" fill="#fffefb" fill-opacity="0.72" font-size="12.5">10M записей × 768 измерений</text>

  <!-- Связь: датасет -> записи -->
  <line x1="816" y1="140" x2="816" y2="172" stroke="#6E675F" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-dim)" />

  <!-- ============ Анатомия записи ============ -->
  <rect x="24" y="176" width="932" height="104" rx="12" fill="#22201E" stroke="#6E675F" stroke-width="1.4" />

  <rect x="40" y="192" width="204" height="48" rx="10" fill="#121212" stroke="#6E675F" stroke-width="1.3" />
  <text x="142" y="222" text-anchor="middle" fill="#fffefb" fill-opacity="0.85" font-size="13">ссылка на изображение</text>

  <rect x="256" y="192" width="204" height="48" rx="10" fill="#121212" stroke="#6E675F" stroke-width="1.3" />
  <text x="358" y="222" text-anchor="middle" fill="#fffefb" fill-opacity="0.85" font-size="13">текстовое описание</text>

  <!-- Эмбеддинг — то, что используется в экспериментах -->
  <rect x="472" y="192" width="252" height="48" rx="10" fill="#262014" stroke="#F2B84B" stroke-width="1.8" />
  <text x="598" y="222" text-anchor="middle" fill="#fffefb" font-size="13" font-weight="600">эмбеддинг, 768 float</text>

  <rect x="736" y="192" width="200" height="48" rx="10" fill="#121212" stroke="#6E675F" stroke-width="1.3" />
  <text x="836" y="222" text-anchor="middle" fill="#fffefb" fill-opacity="0.85" font-size="13">CLIP-score + метаданные</text>

  <!-- Троеточие под строкой -->
  <text x="490" y="263" text-anchor="middle" fill="#fffefb" fill-opacity="0.55" font-size="22" font-weight="600" letter-spacing="6">...</text>
</svg>