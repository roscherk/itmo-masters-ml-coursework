<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F2B84B"/>
    </marker>
    <style>
      .font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Фон -->
  <rect width="800" height="440" rx="16" fill="#121212"/>

  <!-- Запрос q -->
  <circle cx="85" cy="220" r="30" fill="#262014" stroke="#F2B84B" stroke-width="2.5"/>
  <text x="85" y="227" text-anchor="middle" class="font" font-size="22" font-weight="700" font-style="italic" fill="#fffefb">q</text>
  <text x="85" y="272" text-anchor="middle" class="font" font-size="14" font-weight="500" fill="#fffefb" fill-opacity="0.75">Запрос</text>

  <!-- Стрелка: Запрос -> Роутер -->
  <line x1="115" y1="220" x2="228" y2="220" stroke="#F2B84B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Узел роутера -->
  <rect x="230" y="175" width="150" height="90" rx="14" fill="#241E13" stroke="#F2B84B" stroke-width="2"/>
  <text x="305" y="216" text-anchor="middle" class="font" font-size="19" font-weight="700" fill="#fffefb">Роутер</text>
  <text x="305" y="238" text-anchor="middle" class="font" font-size="12" fill="#fffefb" fill-opacity="0.7">маршрутизация</text>

  <!-- Стрелки: Роутер -> выбранные шарды (1, 3, 4) -->
  <path d="M 380 220 C 465 220, 465 60, 558 60" fill="none" stroke="#F2B84B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 380 220 L 558 220" fill="none" stroke="#F2B84B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 380 220 C 465 220, 465 300, 558 300" fill="none" stroke="#F2B84B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Подписи q на стрелках -->
  <g>
    <rect x="457" y="129" width="24" height="22" rx="6" fill="#121212" stroke="#F2B84B" stroke-width="1.2"/>
    <text x="469" y="144" text-anchor="middle" class="font" font-size="14" font-weight="700" font-style="italic" fill="#fffefb">q</text>

    <rect x="457" y="209" width="24" height="22" rx="6" fill="#121212" stroke="#F2B84B" stroke-width="1.2"/>
    <text x="469" y="224" text-anchor="middle" class="font" font-size="14" font-weight="700" font-style="italic" fill="#fffefb">q</text>

    <rect x="457" y="249" width="24" height="22" rx="6" fill="#121212" stroke="#F2B84B" stroke-width="1.2"/>
    <text x="469" y="264" text-anchor="middle" class="font" font-size="14" font-weight="700" font-style="italic" fill="#fffefb">q</text>
  </g>

  <!-- Шард 1 (активный) -->
  <rect x="560" y="32" width="180" height="56" rx="10" fill="#18261A" stroke="#6BC075" stroke-width="2"/>
  <text x="650" y="66" text-anchor="middle" class="font" font-size="16" font-weight="600" fill="#fffefb">Шард 1</text>

  <!-- Шард 2 (не выбран) -->
  <rect x="560" y="112" width="180" height="56" rx="10" fill="#22201E" stroke="#6E675F" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="650" y="146" text-anchor="middle" class="font" font-size="16" font-weight="500" fill="#fffefb" fill-opacity="0.68">Шард 2</text>

  <!-- Шард 3 (активный) -->
  <rect x="560" y="192" width="180" height="56" rx="10" fill="#18261A" stroke="#6BC075" stroke-width="2"/>
  <text x="650" y="226" text-anchor="middle" class="font" font-size="16" font-weight="600" fill="#fffefb">Шард 3</text>

  <!-- Шард 4 (активный) -->
  <rect x="560" y="272" width="180" height="56" rx="10" fill="#18261A" stroke="#6BC075" stroke-width="2"/>
  <text x="650" y="306" text-anchor="middle" class="font" font-size="16" font-weight="600" fill="#fffefb">Шард 4</text>

  <!-- Шард 5 (не выбран) -->
  <rect x="560" y="352" width="180" height="56" rx="10" fill="#22201E" stroke="#6E675F" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="650" y="386" text-anchor="middle" class="font" font-size="16" font-weight="500" fill="#fffefb" fill-opacity="0.68">Шард 5</text>
</svg>